name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Submission gate
        run: uv run python scripts/validate_submissions.py --full

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse DAGs with DagBag (pinned apache/airflow container)
        run: |
          docker run --rm \
            -v "$PWD/tech_stack/airflow/dags:/opt/airflow/dags" \
            -v "$PWD/scripts/check_dagbag.py:/opt/check_dagbag.py:ro" \
            apache/airflow:3.2.1 python /opt/check_dagbag.py
