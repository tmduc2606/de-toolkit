[project]
name = "de-toolkit"
version = "0.1.0"
description = "Data Engineering Toolkit — practice modules and tech-stack learning"
readme = "README.md"
requires-python = ">=3.13"          # actual runtime pinned in .python-version

dependencies = [
    "pandas>=2.3",
    "numpy>=2.3",
    "pyarrow>=21",
    "duckdb>=1.2",
    "pytest>=9",
    "jupyter>=1.1",
    "scikit-learn>=1.6",
    "openpyxl>=3.1",
    "matplotlib>=3.10",
]

[dependency-groups]
dev = ["ruff>=0.11"]
airflow = ["apache-airflow>=3.2.1"]
dbt = ["dbt-core>=1.11", "dbt-databricks>=1.12", "dbt-spark>=1.10"]
spark = ["pyspark>=4.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detoolkit"]

[tool.uv]
default-groups = ["dev"]           # `uv sync` installs main + dev only
package = true

[tool.pytest.ini_options]
testpaths = ["tests", "practice/dsa_de", "practice/sql/problems"]
addopts = "-q"